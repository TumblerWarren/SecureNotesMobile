name: Native Android
on:
  pull_request:
    paths: ['native-android/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build pinned native Argon2 library
        working-directory: native-android
        run: python3 tools/build_sodium.py --ndk "$ANDROID_HOME/ndk/27.2.12479018"
      - name: Compile functional tests
        working-directory: native-android
        run: ./gradlew :core:test :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          working-directory: native-android
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Release and performance checks
        working-directory: native-android
        run: ./gradlew :core:largeFileTest :app:lintDebug :app:assembleRelease :benchmark:assembleBenchmark
      - name: Upload preview and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-preview
          path: |
            native-android/app/build/outputs/apk/debug/*.apk
            native-android/app/build/reports/
            native-android/core/build/reports/
