name: Native Android
on:
  pull_request:
    paths: ['native-android/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build pinned native Argon2 library
        working-directory: native-android
        run: python3 tools/build_sodium.py --ndk "$ANDROID_HOME/ndk/27.2.12479018"
      - name: Compile functional tests
        id: compile
        working-directory: native-android
        run: ./gradlew :core:test :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Release and performance checks
        working-directory: native-android
        run: ./gradlew --continue :core:largeFileTest :app:lintDebug :app:assembleRelease :benchmark:assembleBenchmark
      - name: Report lint errors and generated schema
        if: always()
        working-directory: native-android
        run: |
          python3 - <<'PYREPORT'
          import pathlib, xml.etree.ElementTree as ET
          for report in pathlib.Path('app/build/reports').glob('lint-results-*.xml'):
              for issue in ET.parse(report).getroot().findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      print(ET.tostring(issue, encoding='unicode'))
          schema = pathlib.Path('app/schemas/app.securenote.vault.VaultDatabase/4.json')
          if schema.exists():
              print('GENERATED_SCHEMA_4=' + schema.read_text().replace('\n', ''))
          PYREPORT
      - name: Enable KVM
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation tests
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          working-directory: native-android
          script: bash tools/run_device_checks.sh

      - name: Report device test failures
        if: always()
        working-directory: native-android
        run: |
          python3 - <<'PYREPORT'
          import pathlib, xml.etree.ElementTree as ET
          import base64
          for capture in pathlib.Path("app/build/reports/ui-screenshots").glob("*.png"):
              if capture.read_bytes().startswith(b"\x89PNG"):
                  print("UI_CAPTURE_" + capture.stem + "=" + base64.b64encode(capture.read_bytes()).decode())
          for report in pathlib.Path('app/build/outputs/androidTest-results').rglob('*.xml'):
              for failure in ET.parse(report).getroot().iter('failure'):
                  print(failure.text)
          PYREPORT
      - name: Upload preview and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-preview
          path: |
            native-android/app/build/outputs/apk/debug/*.apk
            native-android/app/build/outputs/apk/release/*.apk
            native-android/benchmark/build/outputs/apk/**/*.apk
            native-android/app/build/reports/
            native-android/core/build/reports/
            native-android/app/schemas/
